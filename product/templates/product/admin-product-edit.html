{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Product Edit</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="admin-body">
  <header class="admin-nav">
    <div class="container admin-nav-inner">
      <a class="brand" href="{% url 'admin_products' %}">YHA Shop Admin</a>
      <nav class="admin-links">
        <a href="#">Profile</a>
        <a href="#">Settings</a>
      </nav>
    </div>
  </header>

  <main class="admin-layout">
    <aside class="sidebar">
      <a class="side-link" href="{% url 'home' %}">Dashboard</a>
      <a class="side-link" href="{% url 'admin_categories' %}">Category Management</a>
      <a class="side-link active" href="{% url 'admin_products' %}">Product Management</a>
      <a class="side-link" href="{% url 'admin_balance' %}">Balance Management</a>
      <a class="side-link danger" href="#">Logout</a>
    </aside>

    <section class="admin-main">
      <h1>Edit Product</h1>
      <div class="panel">
        <div class="panel-head">Edit Product</div>
        <div class="panel-body">
          <form class="form-grid" accordion method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div>
              <label class="form-label" for="product-name">Product Name</label>
              <input class="input" id="product-name" type="text" placeholder="Product Name" value="{{ product.name }}" name="name">
            </div>
            <div>
              <label class="form-label" for="price">Price</label>
              <input class="input" id="price" type="number" step="0.01" placeholder="Price" value="{{ product.price }}" name="price">
            </div>
            <div>
              <label class="form-label" for="category">Category</label>
              <select class="select" id="category" name="category">
                <option>Select Category</option>
                {% for category in categories %}
                  <option value="{{ category.id }}" {% if category.id == product.category.id %}selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div>
              <label class="form-label" for="image">Image</label>
              <input class="input" id="image" type="file" name="image">
            </div>
            <div class="field-full">
              <label class="form-label" for="description">Description</label>
              <textarea class="textarea" id="description" placeholder="Description" name="description">{{ product.description }}</textarea>
            </div>
            <div>
              <label class="form-label">Active</label>
              <label class="checkbox-row">
                <input type="checkbox" {% if product.is_active %}checked{% endif %} name="is_active">
                Is Active
              </label>
            </div>
            <div class="field-full actions">
              <a class="btn btn-muted" href="{% url 'admin_products' %}">Cancel</a>
              <button class="btn btn-blue" type="submit">Update Product</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
