{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Product Form</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="admin-body">
  <header class="admin-nav">
    <div class="container admin-nav-inner">
      <a class="brand" href="{% url 'admin_products' %}">YHA Shop Admin</a>
      <nav class="admin-links">
        <a href="#">Profile</a>
        <a href="#">Settings</a>
      </nav>
    </div>
  </header>

  <main class="admin-layout">
    <aside class="sidebar">
      <a class="side-link" href="{% url 'home' %}">Dashboard</a>
      <a class="side-link" href="{% url 'admin_categories' %}">Category Management</a>
      <a class="side-link active" href="{% url 'admin_products' %}">Product Management</a>
      <a class="side-link" href="{% url 'admin_balance' %}">Balance Management</a>
      <a class="side-link danger" href="#">Logout</a>
    </aside>

    <section class="admin-main">
      <h1>Add New Product</h1>
      <div class="panel">
        <div class="panel-head">Add New Product</div>
        <div class="panel-body">
          <form class="form-grid">
            <div>
              <label class="form-label" for="product-name">Product Name</label>
              <input class="input" id="product-name" type="text" placeholder="Product Name" value="Fresh Mango">
            </div>
            <div>
              <label class="form-label" for="price">Price</label>
              <input class="input" id="price" type="number" step="0.01" placeholder="Price" value="8.00">
            </div>
            <div>
              <label class="form-label" for="category">Category</label>
              <select class="select" id="category">
                <option>Fruits</option>
                <option>Electronics</option>
                <option>Food</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="image">Image</label>
              <input class="input" id="image" type="file">
            </div>
            <div class="field-full">
              <label class="form-label" for="description">Description</label>
              <textarea class="textarea" id="description" placeholder="Description">Sweet seasonal mangoes selected for freshness and flavor.</textarea>
            </div>
            <div>
              <label class="form-label">Active</label>
              <label class="checkbox-row">
                <input type="checkbox" checked>
                Is Active
              </label>
            </div>
            <div class="field-full actions">
              <a class="btn btn-muted" href="{% url 'admin_products' %}">Cancel</a>
              <button class="btn btn-blue" type="submit">Add Product</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
